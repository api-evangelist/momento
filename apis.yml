aid: momento
name: Momento
description: 'Momento is a serverless data platform that provides low-latency, pay-as-you-go
  infrastructure without servers to provision, tune, or scale. Its core services are Momento
  Cache (an ephemeral serverless cache and drop-in Redis replacement), Momento Topics (a
  serverless publish/subscribe event bus), and Momento Leaderboards (massive, durable sorted
  sets). The platform is accessed over gRPC and a region-scoped HTTP API, with official SDKs
  for 15+ languages spanning browsers, mobile (iOS/Android/Flutter/Unity/Unreal), and 10+
  server-side runtimes, plus a CLI and a Terraform provider. Authentication uses Momento API
  keys and short-lived disposable tokens with fine-grained permissions. Momento is backed by
  Bain Capital Ventures.'
