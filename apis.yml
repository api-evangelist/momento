apis:
- name: Momento Cache HTTP API
  description: 'Region-scoped HTTP API for reading, writing, and deleting cache items in a
    Momento cache without a gRPC client. Supports GET, PUT (set with TTL), and DELETE against
    a named cache, authenticated with a Momento API key passed via the Authorization header
    or a query-string token.'
